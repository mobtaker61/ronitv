; Supervisor program for the RoniTV queue worker (URL downloads).
; Install: copy to /etc/supervisor/conf.d/ronitv-worker.conf, then
;   sudo supervisorctl reread && sudo supervisorctl update
; --timeout must be >= DownloadRemoteVideo::$timeout (21600); retry_after in
; config/queue.php (DB_QUEUE_RETRY_AFTER) must be larger than --timeout.
[program:ronitv-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ronitv/artisan queue:work --sleep=3 --tries=1 --timeout=21600 --max-time=3600
directory=/var/www/ronitv
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/ronitv/storage/logs/worker.log
