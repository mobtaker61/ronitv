; Supervisor program for Laravel's scheduler (runs the hourly media:prune, no cron needed).
; Install: copy to /etc/supervisor/conf.d/ronitv-scheduler.conf, then
;   sudo supervisorctl reread && sudo supervisorctl update
[program:ronitv-scheduler]
command=php /var/www/ronitv/artisan schedule:work
directory=/var/www/ronitv
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/ronitv-scheduler.log
